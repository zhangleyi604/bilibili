<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <base target="_self">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>哔哩哔哩 · 第二组课程项目</title>
  <link rel="stylesheet" href="/home.css?v=7">
  <link rel="stylesheet" href="/space.css?v=2">
  <script src="/space.js?v=1" defer></script>
  <script src="/home.js" defer></script>
  <script src="/login.js?v=2" defer></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></symbol>
    <symbol id="i-tv" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="m8 2 4 4 4-4M8 12l2 1m6-1-2 1"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M6 9h5m3 0h4M8 13h5m3 0h2"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.8 5.6 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.5l6.2-.9z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M4 16v4h16v-4M12 16V4m-4 4 4-4 4 4"/></symbol>
    <symbol id="i-article" viewBox="0 0 24 24"><path d="M11 21H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v6M7 7h7M7 11h4M7 15h3m8 7V13m-3 3 3-3 3 3"/></symbol>
    <symbol id="i-video-upload" viewBox="0 0 24 24"><rect x="2" y="4" width="19" height="15" rx="2"/><path d="m9 8 5 3-5 3zM18 22v-7m-3 3 3-3 3 3"/></symbol>
    <symbol id="i-manage" viewBox="0 0 24 24"><path d="M10 21H5a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h10l4 4v5M15 2v5h4m-2 6 4 2v4l-4 2-4-2v-4z"/></symbol>
    <symbol id="i-flame" viewBox="0 0 24 24"><path d="M13 2c1 5-3 6-3 10-2 0-3-2-3-4-3 3-4 5-3 8a8 8 0 0 0 16-1c0-4-3-8-7-13z"/><path d="M12 13c3 2 4 6 0 7-3-1-2-5 0-7z"/></symbol>
    <symbol id="i-rank" viewBox="0 0 24 24"><path d="M3 20h18M5 20v-7h4v7m1 0V5h4v15m1 0V9h4v11"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5m-4-2a8 8 0 0 1 13-4l2 4M4 14l2 4a8 8 0 0 0 13-4"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
    <symbol id="i-top" viewBox="0 0 24 24"><path d="M5 4h14m-7 16V8m-6 6 6-6 6 6"/></symbol>
  </svg>
  <header class="masthead">
    <nav class="navbar" aria-label="主导航">
      <a class="home-link" href="/" target="_self" aria-label="返回首页"><svg><use href="#i-tv"/></svg>首页</a>
      <form class="search" role="search" action="/search" method="get">
        <input name="keyword" id="keyword" aria-label="搜索视频、UP主或标签" placeholder="搜索视频、UP主或标签" maxlength="80">
        <button aria-label="搜索"><svg><use href="#i-search"/></svg></button>
      </form>
      <div class="nav-right">
        <button type="button" class="login" data-login="登录" aria-haspopup="dialog">登录</button>
        <button type="button" class="nav-item" data-login="消息" aria-haspopup="dialog"><svg><use href="#i-mail"/></svg>消息</button>
        <button type="button" class="nav-item" data-login="收藏" aria-haspopup="dialog"><svg><use href="#i-star"/></svg>收藏</button>
        <button type="button" class="nav-item" data-login="历史" aria-haspopup="dialog"><svg><use href="#i-clock"/></svg>历史</button>
        <button type="button" class="nav-item" data-login="创作中心" aria-haspopup="dialog"><svg><use href="#i-rank"/></svg>创作中心</button>
        <button type="button" class="upload" data-login="投稿" aria-haspopup="dialog"><svg><use href="#i-upload"/></svg>投稿</button>
      </div>
    </nav>
    <div class="banner"><a href="/" target="_self" class="banner-logo" aria-label="哔哩哔哩首页"><span>bilibili</span></a></div>
  </header>

  <main class="layout">
    <section class="channels" aria-label="频道和分区">
      <div class="channel-icons">
        <a href="/popular"><span class="channel-circle orange"><svg><use href="#i-flame"/></svg></span>热门</a>
      </div>
      <div class="categories" id="categories"></div>
      <div class="channel-links">
        <a href="/popular/rank"><svg><use href="#i-rank"/></svg>排行榜</a>
        <a href="/latest"><svg><use href="#i-clock"/></svg>最新发布</a>
        <a href="/recommend"><svg><use href="#i-play"/></svg>推荐视频</a>
        <a href="/service/活动"><svg><use href="#i-star"/></svg>活动</a>
      </div>
    </section>

    <section id="author-profile" class="author-profile" aria-label="作者资料" hidden>
      <div class="space-cover">
        <div class="space-identity"><div id="author-avatar" class="author-avatar"></div>
          <div><div class="space-name"><h1 id="author-name"></h1><span id="author-level"></span></div><p id="author-signature"></p></div>
        </div>
        <div class="space-actions">
          <button class="follow" data-login="关注" aria-haspopup="dialog">＋ 关注</button>
          <button data-login="发消息" aria-haspopup="dialog">发消息</button>
          <div class="space-more">
            <button class="space-more-trigger" aria-label="更多操作" aria-controls="space-more-menu">⋮</button>
            <div id="space-more-menu" class="space-more-menu">
              <button data-login="加入黑名单" aria-haspopup="dialog">加入黑名单</button>
              <button data-login="举报" aria-haspopup="dialog">举报</button>
            </div>
          </div>
        </div>
      </div>
      <nav class="space-nav" aria-label="个人空间">
        <div id="space-tabs"></div>
        <form id="space-search"><input name="keyword" placeholder="搜索视频" aria-label="搜索作者的视频" maxlength="80"><button aria-label="搜索作者的视频"><svg><use href="#i-search"/></svg></button></form>
        <div class="space-counts"><div>关注数<strong id="author-following"></strong></div><div>粉丝数<strong id="author-followers"></strong></div></div>
      </nav>
      <div class="space-body"><div id="space-content"></div>
        <aside class="space-sidebar"><section><h2>个人资料</h2><p id="author-uid"></p><p id="author-birthday" hidden></p></section></aside>
      </div>
    </section>
    <section aria-label="视频浏览" class="feed">
      <div id="feed-toolbar" class="feed-toolbar" hidden><div><h1 id="feed-title"></h1><p id="feed-note"></p></div><a href="/" class="secondary">返回推荐</a></div>
      <div id="featured" class="featured">
        <section class="carousel" aria-label="首页轮播">
          <a href="/popular" id="slide-action" class="slide" aria-label="打开轮播内容"><img id="slide-image" src="/assets/carousel.webp" alt=""><span id="slide-title">每一次相遇，都有新的精彩</span></a>
          <div class="carousel-controls">
            <div id="dots" class="dots"></div>
            <div class="arrows"><button id="prev-slide" aria-label="上一张"><svg><use href="#i-left"/></svg></button><button id="next-slide" aria-label="下一张"><svg><use href="#i-right"/></svg></button></div>
          </div>
        </section>
        <div class="top-cards" id="top-cards"></div>
        <button class="refresh" id="refresh"><svg><use href="#i-refresh"/></svg><span>换一换</span></button>
      </div>
      <div id="video-grid" class="video-grid"></div>
      <ol id="rank-list" class="rank-list" hidden></ol>
      <p id="status" role="status" class="status">正在加载视频…</p>
      <nav id="pagination" class="pagination" aria-label="分页"></nav>
    </section>
    <section id="video-page" class="watch-layout" hidden>
      <article>
        <h1 id="video-title">正在加载…</h1>
        <p id="video-meta" class="video-meta"></p>
        <video id="player" controls playsinline preload="metadata"></video>
        <p id="player-status" class="status" role="status" hidden></p>
        <p id="video-description"></p>
        <div id="video-tags" class="video-tags"></div>
      </article>
      <aside><h2>接下来播放</h2><div id="related-videos"></div></aside>
    </section>
    <section id="service-page" class="service-page" hidden>
      <h1 id="service-title"></h1>
      <p id="service-message"></p>
      <a class="secondary" href="/">返回首页</a>
    </section>
    <footer>哔哩哔哩首页复刻 · 第二组数据库课程项目</footer>
  </main>
  <button class="back-top" aria-label="返回顶部"><svg><use href="#i-top"/></svg>顶部</button>
  <section id="login-popover" class="login-popover" aria-label="登录提示" hidden>
    <div id="login-prompt">
      <p id="login-popover-title">登录后你可以：</p>
      <div id="login-benefits" class="login-benefits">
        <span><b>HD</b>免费看高清视频</span>
        <span><svg><use href="#i-clock"/></svg>多端同步播放记录</span>
        <span><svg><use href="#i-list"/></svg>发弹幕/评论</span>
        <span><svg><use href="#i-play"/></svg>热门番剧影视看不停</span>
      </div>
      <button type="button" class="login-primary" id="popover-login">立即登录</button>
      <p id="popover-register" class="popover-register">首次使用？ <a href="/service/注册">点我注册</a></p>
    </div>
    <div id="upload-actions" class="upload-actions" hidden>
      <button type="button"><svg><use href="#i-article"/></svg>专栏投稿</button>
      <button type="button"><svg><use href="#i-video-upload"/></svg>视频投稿</button>
      <button type="button"><svg><use href="#i-manage"/></svg>投稿管理</button>
    </div>
  </section>
  <dialog id="login-dialog" class="login-dialog" aria-labelledby="login-title">
    <button type="button" id="close-login" class="close-login" aria-label="关闭登录窗口">×</button>
    <h2 id="login-title">密码登录</h2>
    <form id="login-form" class="login-form" method="post">
      <div class="login-fields">
        <label><span>账号</span><input name="account" autocomplete="username" placeholder="请输入账号" required maxlength="80" autofocus></label>
        <label><span>密码</span><input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" required maxlength="128"><button type="button" id="toggle-password" aria-label="显示密码" aria-pressed="false">显示</button></label>
      </div>
      <p id="login-message" class="login-message" role="status"></p>
      <div class="login-actions"><a href="/service/注册" class="secondary">注册</a><button type="submit" class="login-primary">登录</button></div>
    </form>
    <img class="login-mascot mascot-left" src="/assets/login-22-open.png" alt="" aria-hidden="true">
    <img class="login-mascot mascot-right" src="/assets/login-33-open.png" alt="" aria-hidden="true">
  </dialog>
</body>
</html>
