spring.application.name=bilibili-home
server.address=127.0.0.1
server.port=${BILI_PORT:8080}
app.media-root=${BILI_MEDIA_ROOT:..}
spring.datasource.url=${BILI_DB_URL:jdbc:mysql://127.0.0.1:3306/bilibili_v6?connectionTimeZone=Asia/Shanghai&characterEncoding=UTF-8}
spring.datasource.username=${BILI_DB_USER:root}
spring.datasource.password=${BILI_DB_PASSWORD:}
spring.datasource.hikari.connection-timeout=4000
spring.datasource.hikari.initialization-fail-timeout=-1
